<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hannah Mariel Tamayo — Computer Engineer, Full-Stack and AI Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6f9"/>
      <stop offset="0.55" stop-color="#fde1eb"/>
      <stop offset="1" stop-color="#f7c9dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#a8517a"/>
      <stop offset="0.45" stop-color="#a8517a"/>
      <stop offset="0.5" stop-color="#f0a9c6"/>
      <stop offset="0.55" stop-color="#a8517a"/>
      <stop offset="1" stop-color="#a8517a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d477a2" flood-opacity="0.35"/>
    </filter>
    <path id="heart" d="M0 5c-4-8-15-6-15 2.5 0 7 8 12 15 17 7-5 15-10 15-17 0-8.5-11-10.5-15-2.5z"/>
    <g id="bow">
      <path d="M0 0c-16-12-38-10-38 9s22 21 38 9c16 12 38 10 38-9s-22-21-38-9z" fill="#f6a6c5" stroke="#df78a4" stroke-width="2.5"/>
      <path d="M-7 7C-18 20-24 36-22 52M7 7C18 20 24 36 22 52" fill="none" stroke="#df78a4" stroke-width="3" stroke-linecap="round"/>
      <circle r="8" fill="#f9c2d6" stroke="#df78a4" stroke-width="2.5"/>
    </g>
    <path id="spark" d="M0 -11C1.7 -3.3 3.3 -1.7 11 0 3.3 1.7 1.7 3.3 0 11 -1.7 3.3 -3.3 1.7 -11 0 -3.3 -1.7 -1.7 -3.3 0 -11z" fill="#ffffff"/>
    <style>
      .float  { animation: float 7s ease-in-out infinite; }
      .twinkle{ animation: twinkle 3.2s ease-in-out infinite; }
      .sway   { animation: sway 6s ease-in-out infinite; }
      .caret  { animation: blink 1s steps(1) infinite; }
      .d1{ animation-delay:-1s } .d2{ animation-delay:-2s } .d3{ animation-delay:-3s } .d4{ animation-delay:-4s }
      @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
      @keyframes twinkle{ 0%,100%{opacity:.35;transform:scale(.6)} 50%{opacity:1;transform:scale(1)} }
      @keyframes sway   { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
      @keyframes blink  { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @media (prefers-reduced-motion: reduce){
        .float,.twinkle,.sway,.caret{animation:none}
        .twinkle{opacity:.85}
      }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <g fill="#ffffff" opacity="0.75">
    <circle cx="95" cy="58" r="4"/><circle cx="150" cy="96" r="3"/><circle cx="214" cy="52" r="3.5"/>
    <circle cx="1044" cy="66" r="4"/><circle cx="1104" cy="104" r="3"/><circle cx="982" cy="50" r="3.5"/>
  </g>

  <!-- floating hearts: outer group positions, inner group animates -->
  <g transform="translate(150 250)"><g class="float d1"><use xlink:href="#heart" transform="scale(2.2)" fill="#f19dbd"/></g></g>
  <g transform="translate(1024 240)"><g class="float d3"><use xlink:href="#heart" transform="scale(2.3)" fill="#ee8bb1"/></g></g>
  <g transform="translate(1088 150)"><g class="float d2"><use xlink:href="#heart" transform="scale(1.4)" fill="#f6b9d2"/></g></g>
  <g transform="translate(104 158)"><g class="float d4"><use xlink:href="#heart" transform="scale(1.7)" fill="#f6b9d2"/></g></g>

  <!-- sparkles -->
  <g transform="translate(296 92)"><g class="twinkle d1"><use xlink:href="#spark"/></g></g>
  <g transform="translate(904 108)"><g class="twinkle d3"><use xlink:href="#spark" transform="scale(1.4)"/></g></g>
  <g transform="translate(628 58)"><g class="twinkle d2"><use xlink:href="#spark" transform="scale(.9)"/></g></g>
  <g transform="translate(770 250)"><g class="twinkle d4"><use xlink:href="#spark" transform="scale(1.2)"/></g></g>
  <g transform="translate(452 258)"><g class="twinkle d1"><use xlink:href="#spark" transform="scale(.8)"/></g></g>

  <!-- bows -->
  <g transform="translate(126 80)"><g class="sway d1"><use xlink:href="#bow" filter="url(#soft)"/></g></g>
  <g transform="translate(1074 84)"><g class="sway d3"><use xlink:href="#bow" transform="scale(.82)" filter="url(#soft)"/></g></g>

  <!-- name -->
  <text x="600" y="162" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-style="italic" font-weight="700" fill="url(#shine)"
        filter="url(#soft)">Hannah Mariel Tamayo</text>

  <!-- subtitle with blinking caret -->
  <g transform="translate(600 208)" text-anchor="middle">
    <text font-family="'Courier New', Courier, monospace" font-size="21" letter-spacing="1.4"
          fill="#8a4a6a">Computer Engineer &#183; Full-Stack &amp; AI Developer</text>
  </g>
  <rect class="caret" x="922" y="192" width="10" height="22" fill="#d074a1"/>

  <!-- scalloped lace hem -->
  <g fill="#ffffff">
    <circle cx="25" cy="306" r="21"/><circle cx="75" cy="306" r="21"/><circle cx="125" cy="306" r="21"/>
    <circle cx="175" cy="306" r="21"/><circle cx="225" cy="306" r="21"/><circle cx="275" cy="306" r="21"/>
    <circle cx="325" cy="306" r="21"/><circle cx="375" cy="306" r="21"/><circle cx="425" cy="306" r="21"/>
    <circle cx="475" cy="306" r="21"/><circle cx="525" cy="306" r="21"/><circle cx="575" cy="306" r="21"/>
    <circle cx="625" cy="306" r="21"/><circle cx="675" cy="306" r="21"/><circle cx="725" cy="306" r="21"/>
    <circle cx="775" cy="306" r="21"/><circle cx="825" cy="306" r="21"/><circle cx="875" cy="306" r="21"/>
    <circle cx="925" cy="306" r="21"/><circle cx="975" cy="306" r="21"/><circle cx="1025" cy="306" r="21"/>
    <circle cx="1075" cy="306" r="21"/><circle cx="1125" cy="306" r="21"/><circle cx="1175" cy="306" r="21"/>
  </g>
  <rect x="0" y="318" width="1200" height="22" fill="#ffffff"/>
  <path d="M0 318 H1200" fill="none" stroke="#f0a3c3" stroke-width="2" opacity="0.85"/>
  <g fill="#f4b7d0">
    <circle cx="25" cy="306" r="4"/><circle cx="125" cy="306" r="4"/><circle cx="225" cy="306" r="4"/>
    <circle cx="325" cy="306" r="4"/><circle cx="425" cy="306" r="4"/><circle cx="525" cy="306" r="4"/>
    <circle cx="625" cy="306" r="4"/><circle cx="725" cy="306" r="4"/><circle cx="825" cy="306" r="4"/>
    <circle cx="925" cy="306" r="4"/><circle cx="1025" cy="306" r="4"/><circle cx="1125" cy="306" r="4"/>
  </g>
</svg>
